<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory</title>
  <link rel="stylesheet" href="style.css">
  <script src="users.js" defer></script>
</head>
<body>
  <header>
    <h1>User Directory</h1>
    <p>Load and filter users from a public REST API.</p>
  </header>
  <main>
    <section aria-labelledby="users-heading">
      <h2 id="users-heading">Users</h2>
      <button id="load-users" type="button">Load Users</button>
      <label for="filter-input">Filter by name</label>
      <input id="filter-input" type="search" placeholder="Start typing a name..." autocomplete="off">
      <p id="status" role="status" aria-live="polite">Click “Load Users” to fetch the directory.</p>
      <ul id="users-list" aria-label="Users list"></ul>
    </section>
  </main>
</body>
</html>
